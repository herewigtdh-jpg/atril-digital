<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabina del Docente | Atril Digital</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:var(--color-fondo-secundario)}
    .cabina{max-width:1100px;margin:2rem auto;padding:0 1rem;display:grid;grid-template-columns:1.4fr 1fr;gap:1.5rem}
    .cabina-video{background:#000;border-radius:12px;aspect-ratio:16/9;position:relative;overflow:hidden}
    .cabina-video video{width:100%;height:100%;object-fit:cover}
    #estadoCabina{position:absolute;top:10px;left:10px;background:var(--color-anomalia);color:#fff;padding:4px 12px;border-radius:4px;font-weight:700}
    .panel-cabina{background:#fff;border:2px solid var(--color-borde);border-radius:12px;padding:1.5rem}
    .panel-cabina button{margin:.35rem 0;width:100%}
    .fila-interpelacion{display:flex;justify-content:space-between;gap:.5rem;background:var(--color-fondo-secundario);border-radius:6px;padding:.5rem;margin-bottom:.5rem;font-size:.875rem}
    .acceso{max-width:420px;margin:4rem auto;background:#fff;padding:2rem;border-radius:12px;border:2px solid var(--color-borde)}
    .acceso label{display:block;font-weight:600;margin:.75rem 0 .25rem}
    .acceso input{width:100%;padding:.65rem;border:2px solid var(--color-borde);border-radius:8px;font:inherit}
    @media(max-width:900px){.cabina{grid-template-columns:1fr}}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <header class="atrio-principal">
    <div class="contenedor-header">
      <div class="logo-marca"><span class="emoji-logo">🎙️</span>
        <div class="texto-marca"><h1>Cabina del Docente Nativo</h1><p class="lema">Control de transmisión del Atril Digital</p></div>
      </div>
    </div>
  </header>

  <section class="acceso" id="zonaAcceso">
    <h2>Acceso reservado al docente</h2>
    <form id="formAcceso">
      <label for="emailAcceso">Correo electrónico</label>
      <input id="emailAcceso" type="email" required>
      <label for="passAcceso">Contraseña</label>
      <input id="passAcceso" type="password" required>
      <p class="modal-error" id="errorAcceso" role="alert"></p>
      <button class="btn-principal" type="submit" style="width:100%">Ingresar a la cabina</button>
    </form>
    <p id="notaRol" class="descripcion-progreso" hidden></p>
  </section>

  <main class="cabina" id="zonaCabina" hidden>
    <div>
      <div class="cabina-video">
        <video id="videoLocal" autoplay muted playsinline></video>
        <span id="estadoCabina">EN ESPERA</span>
      </div>
      <div class="panel-cabina" style="margin-top:1rem">
        <button class="btn-principal" id="btnCamara">Encender cámara y micrófono</button>
        <button class="btn-secundario" id="btnMicro">Silenciar micrófono</button>
        <button class="btn-secundario" id="btnPantalla">Compartir pantalla</button>
        <button class="btn-principal" id="btnIniciar">Iniciar Sesión de Inmersión (EN DIRECTO)</button>
        <button class="btn-secundario" id="btnCerrarSesion">Concluir la sesión</button>
      </div>
    </div>
    <div>
      <div class="panel-cabina">
        <h2>Término del Momento</h2>
        <label for="inputTermino" class="sr-only">Término del Momento</label>
        <input id="inputTermino" placeholder="Ej.: Ratificar" style="width:100%;padding:.65rem;border:2px solid var(--color-borde);border-radius:8px">
        <button class="btn-principal" id="btnTermino" style="margin-top:.5rem">Fijar en el aula</button>
        <h2 style="margin-top:1rem">Archivar sesión en la biblioteca</h2>
        <label for="inputTitulo" class="sr-only">Título de la sesión</label>
        <input id="inputTitulo" placeholder="Título (ej.: Sesión 12: condicionales)" style="width:100%;padding:.65rem;border:2px solid var(--color-borde);border-radius:8px">
        <button class="btn-secundario" id="btnArchivar" style="margin-top:.5rem">Archivar en la biblioteca</button> 
      </div>
      <div class="panel-cabina" style="margin-top:1rem">
        <h2>Interpelaciones del aula</h2>
        <div id="listaInterpelaciones"></div>
      </div>
    </div>
  </main>

  <div class="contenedor-toast" id="toastContainer" aria-live="polite"></div>
  <script src="firebase-config.js"></script>
  <script src="docente.js"></script>
</body>
</html>
